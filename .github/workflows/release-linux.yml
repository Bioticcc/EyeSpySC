name: Release Linux

on:
  push:
    tags:
      - "v*"
  # Manual dry run: builds and verifies the package without publishing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x86_64 release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      SIDECAR_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes zip
      - name: Create backend build environment
        run: |
          python3 -m venv backend/.venv
          backend/.venv/bin/python -m pip install --require-hashes -r backend/requirements-build.lock
          backend/.venv/bin/python -m pip install --no-deps -e ./backend
      - name: Run application checks
        run: ./scripts/check.sh
      - name: Build Linux sidecar
        run: bash scripts/build-linux-sidecars.sh "${SIDECAR_TARGET}"
      - name: Smoke packaged CLI
        run: |
          bash scripts/smoke-packaged-cli.sh \
            "backend/dist/sidecars/eyespysc-cli-${SIDECAR_TARGET}" \
            "${GITHUB_SHA}"
      - name: Build, verify, and collect release artifacts
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')
          if [[ "${REF_TYPE}" == "tag" ]]; then
            release_version="${RELEASE_TAG#v}"
            if [[ "${release_version}" != "${package_version}" ]]; then
              echo "Tag ${RELEASE_TAG} does not match package version ${package_version}." >&2
              exit 1
            fi
          else
            release_version="${package_version}"
          fi

          deb_directory="build/deb"
          bash scripts/build-linux-deb.sh \
            --version "${release_version}" \
            --cli "backend/dist/sidecars/eyespysc-cli-${SIDECAR_TARGET}" \
            --output-dir "${deb_directory}"
          shopt -s nullglob
          deb_candidates=("${deb_directory}/"*.deb)
          if (( ${#deb_candidates[@]} != 1 )); then
            echo "Expected exactly one Debian package under ${deb_directory}; found ${#deb_candidates[@]}." >&2
            exit 1
          fi
          deb_source="${deb_candidates[0]}"

          debian_version=$(dpkg-deb --field "${deb_source}" Version)
          # Keep this in lockstep with scripts/normalize-debian-release-version.sh.
          if [[ ! "${release_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z][0-9A-Za-z.-]*))?$ ]]; then
            echo "Release version ${release_version} is not SemVer." >&2
            exit 1
          fi
          expected_debian_version="${BASH_REMATCH[1]}"
          if [[ -n "${BASH_REMATCH[3]:-}" ]]; then
            expected_debian_version="${expected_debian_version}~${BASH_REMATCH[3]}"
          fi
          if [[ "${debian_version}" != "${expected_debian_version}" ]]; then
            echo "Debian package Version ${debian_version} does not match ${expected_debian_version}." >&2
            exit 1
          fi
          if [[ "$(dpkg-deb --field "${deb_source}" Package)" != "eyespysc" ]]; then
            echo "Debian package name is not eyespysc." >&2
            exit 1
          fi

          # The package holds exactly these files and nothing else.
          dpkg-deb --fsys-tarfile "${deb_source}" | tar --list --file=- | grep -v '/$' | sort >package-files.txt
          printf '%s\n' \
            ./usr/bin/eyespysc \
            ./usr/share/doc/eyespysc/README.md \
            ./usr/share/doc/eyespysc/THIRD_PARTY_NOTICES.md \
            ./usr/share/doc/eyespysc/copyright | sort >expected-files.txt
          if ! diff -u expected-files.txt package-files.txt; then
            echo "Release Debian package contents differ from the expected list." >&2
            exit 1
          fi

          # Smoke the binary exactly as packaged, including its build revision.
          extracted=$(mktemp -d)
          dpkg-deb --extract "${deb_source}" "${extracted}"
          bash scripts/smoke-packaged-cli.sh "${extracted}/usr/bin/eyespysc" "${GITHUB_SHA}"

          bash scripts/create-linux-release-zip.sh \
            --version "${release_version}" \
            --deb "${deb_source}" \
            --output-dir release-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eyespysc-linux-release-${{ github.ref_name }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eyespysc-linux-release-${{ github.ref_name }}
          path: release-artifacts
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          zip_name="EyeSpySC_ver${release_version}_Linux-x86_64_Ubuntu-Debian.zip"
          # This job intentionally has no source checkout. Read the annotated
          # tag object through the authenticated GitHub API instead.
          tag_object_sha=$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object | select(.type == "tag") | .sha')
          if [[ -z "${tag_object_sha}" ]]; then
            echo "${RELEASE_TAG} must be an annotated tag." >&2
            exit 1
          fi
          tag_message=$(gh api "repos/${GH_REPO}/git/tags/${tag_object_sha}" --jq '.message')
          release_title=${tag_message%%$'\n'*}
          expected_title="EyeSpySC ${RELEASE_TAG}: "
          if [[ "${release_title}" != "${expected_title}"* ]]; then
            echo "Annotated tag message must start with: ${expected_title}<short title>" >&2
            exit 1
          fi
          release_flags=()
          if [[ "${release_version}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            while IFS= read -r asset_name; do
              if [[ "${asset_name}" != "${zip_name}" ]]; then
                gh release delete-asset "${RELEASE_TAG}" "${asset_name}" \
                  --yes \
                  --repo "${GH_REPO}"
              fi
            done < <(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json assets --jq '.assets[].name')
            gh release upload "${RELEASE_TAG}" "release-artifacts/${zip_name}" \
              --clobber \
              --repo "${GH_REPO}"
          else
            gh release create "${RELEASE_TAG}" "release-artifacts/${zip_name}" \
              --title "${release_title}" \
              --generate-notes \
              --repo "${GH_REPO}" \
              "${release_flags[@]}"
          fi
