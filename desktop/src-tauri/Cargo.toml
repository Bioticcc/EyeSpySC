[package]
name = "eyespysc-desktop"
version = "0.1.0-rc.3"
description = "Sperm counting for 20x phase-contrast images"
authors = ["Yan Lab <adamward.bio@gmail.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "eyespysc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.2.0"
