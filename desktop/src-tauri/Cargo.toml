[package]
name = "eyespysc-desktop"
version = "0.1.0-rc.5"
description = "Sperm counting for 20x phase-contrast images"
authors = ["Yan Lab <adamward.bio@gmail.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "eyespysc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri crates are pinned exactly. The JavaScript side (@tauri-apps/api,
# @tauri-apps/plugin-dialog in desktop/package.json) must match their
# major.minor: a mismatch silently breaks progress channels.
# desktop/test/tauriVersions.test.ts enforces this.
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "=2.7.3"
